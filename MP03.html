<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> 구구단을 외자 </h1>
    <script>
        let mul=2;
        let i=1;
        for (mul=2; mul<=9; mul++) {
              for (i=1; i<=9; i++) {
                document.write(mul + 'X' + i + '=' + mul*i + '<br>');
            }
            document.write('<br>');
        }
    </script>
</body>
</html>
