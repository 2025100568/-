<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

        .gowun-dodum-regular {
            font-family: "Gowun Dodum", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
        }

        h1 {
            color: #434D97;
            text-align: center;
            margin: 20px;
        }

        p {
            text-align: center;
            font-weight: bold;
            margin: 10px;
        }

        table {
            /* 표가 화면을 꽉 채우지 않고 내용만큼만 차지하도록 margin 중앙 정렬 추가 */
            margin: 0 auto; 
            border: 2px solid #333;
            /* 테두리 두 줄 겹침을 하나로 합쳐 깔끔하게 만드는 속성 */
            border-collapse: collapse; 
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            /* 모든 셀의 최소 높이를 일정하게 부여하여 좁은 칸 방지 */
            height: 50px; 
        }

        th {
            /* 요일 칸들의 너비를 120px로 모두 동일하게 고정 */
            width: 120px; 
            background-color: #f8f9fa; 
            color: #333;
        }

        .chapel { background-color: #dcedc8; } 
        .history { background-color: #fff9c4; } 
        .ai-health { background-color: #b2ebf2; } 
        .web { background-color: #bbdefb; } 
        .life { background-color: #f5f5f5; } 
        .bible { background-color: #ffe0b2; } 
        .db { background-color: #ffccbc; } 
        .ai-semi { background-color: #ffcdd2; } 

        .major-underline {
            text-decoration: underline;
            text-decoration-color: white; 
            text-decoration-thickness: 2px; 
        }

        td:hover {
            background-color: #eee;
        }
    </style>
</head>
<body class="gowun-dodum-regular">
    <h1>2학년 2학기 시간표</h1>
    <p>학번: 2025100568 | 이름: 안세희</p>
    
    <table>
        <thead>
            <tr>
                <!-- 교시를 나타내는 첫 열만 좁게 설정하여 비율 최적화 -->
                <th style="width: 50px;"></th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>9</td>
                <td></td>
                <td></td>
                <td></td>
                <td rowspan="3" class="db major-underline">데이터베이스<br>설계</td>
                <td></td>
            </tr>
            <tr>
                <td>10</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>11</td>
                <td class="chapel">채플</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>12</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>1</td>
                <td rowspan="2" class="history">역사와문화</td>
                <td></td>
                <td rowspan="3" class="bible">경전의 지혜<br>(구,중국고전과<br>성서)</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>2</td>
                <td rowspan="3" class="web major-underline">웹프로그래밍</td>
                <td rowspan="3" class="ai-semi major-underline">AI반도체공정</td>
                <td></td>
            </tr>
            <tr>
                <td>3</td>
                <td rowspan="3" class="ai-health">AI 디지털헬스</td>
                <td></td>
            </tr>
            <tr>
                <td>4</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>5</td>
                <td class="life">인생설계와 <br>로 II</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
